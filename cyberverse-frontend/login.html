<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberVerse — Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <canvas id="matrixCanvas"></canvas>

    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
               <div class="logo">
            CyberVerse
        </div>
                <h1>Welcome Back</h1>
                <p class="auth-subtitle">Enter your credentials to access your dashboard</p>

                <form id="loginForm">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="student@cyberverse.io" required>

                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>

                    <div id="formError" class="form-error"></div>

                    <button type="submit" class="btn btn-primary auth-button">Log In</button>
                </form>

                <p class="auth-bottom">
                    Don't have an account? <a href="register.html">Sign Up</a>
                </p>
                <a href="index.html" class="back-home">&larr; Back to Home</a>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
