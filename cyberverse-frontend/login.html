<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CyberVerse — Login</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">

</head>

<body class="auth-page">

    <canvas id="matrixCanvas"></canvas>


    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                <span>&lt;/&gt;</span>
                CyberVerse
            </div>


            <h1>Welcome Back</h1>

            <p class="auth-subtitle">
                Login to continue your cybersecurity journey.
            </p>


            <form id="loginForm">

                <label for="loginEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="you@example.com"
                    required
                >


                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >


                <p
                    id="loginError"
                    class="form-error"
                ></p>


                <button
                    type="submit"
                    class="btn btn-primary auth-button"
                >
                    Login
                </button>

            </form>


            <p class="auth-bottom">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>


            <a
                href="index.html"
                class="back-home"
            >
                ← Back to CyberVerse
            </a>

        </div>

    </div>


    <script src="js/auth.js"></script>

</body>
</html>
