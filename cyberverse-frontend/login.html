<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberVerse — Login</title>
    <meta name="description" content="Log in to the CyberVerse educational demo. Accounts are stored only in your own browser.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23050807'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%2339ff8e' font-family='monospace'%3EC%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/pages.css">
</head>

<body>

    <!-- Background Matrix Animation -->
    <canvas id="matrixCanvas"></canvas>

    <!-- Top Navigation Header -->
    <header class="navbar">
        <div class="logo">
            <a href="index.html">CyberVerse</a>
        </div>

    </header>

    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                <h1>Welcome Back</h1>
                <p class="auth-subtitle">Enter your credentials to access your dashboard</p>

                <p class="demo-notice" role="note">
                    Educational demo project: accounts are saved only in this browser, not on a server. Please do not use a real password.
                </p>

                <form id="loginForm">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="student@cyberverse.io" autocomplete="email" required>

                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>

                    <div id="formError" class="form-error"></div>

                    <button type="submit" class="btn btn-primary auth-button">Log In</button>
                </form>

                <p class="auth-bottom">
                    Don't have an account? <a href="register.html">Sign Up</a>
                </p>
                <a href="index.html" class="back-home">&larr; Back to Home</a>

                <p class="auth-legal">
                    <a href="about.html">About</a> &middot; <a href="privacy.html">Privacy</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
