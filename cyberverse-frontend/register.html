<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CyberVerse — Create Account</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-page">

    <canvas id="matrixCanvas"></canvas>

    <div class="auth-container">

        <div class="auth-card">

            <!-- CREATIVE LOGO -->
            <div class="auth-logo">
                <span class="logo-symbol">◈</span>
                CYBER<span>VERSE</span>
            </div>

            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Start your cybersecurity learning journey.
            </p>

            <form id="registerForm">

                <!-- NAME -->
                <label for="registerName">Full Name</label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your name"
                    required
                >

                <!-- EMAIL -->
                <label for="registerEmail">Email Address</label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="you@example.com"
                    required
                >

                <!-- AVATAR -->
                <label for="registerGender">Avatar</label>

                <select id="registerGender" required>
                    <option value="">Select your avatar</option>
                    <option value="male">👦 Boy Avatar</option>
                    <option value="female">👧 Girl Avatar</option>
                </select>

                <!-- PASSWORD -->
                <label for="registerPassword">Password</label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                    required
                >

                <!-- CONFIRM PASSWORD -->
                <label for="registerConfirm">Confirm Password</label>

                <input
                    type="password"
                    id="registerConfirm"
                    placeholder="Confirm your password"
                    required
                >

                <p id="registerError" class="form-error"></p>

                <button
                    type="submit"
                    class="btn btn-primary auth-button"
                >
                    Create Account
                </button>

            </form>

            <p class="auth-bottom">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

            <a href="index.html" class="back-home">
                ← Back to CyberVerse
            </a>

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>
</html>
