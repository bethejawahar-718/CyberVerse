<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberVerse — Register</title>
    <meta name="description" content="Create a demo account on CyberVerse. Accounts are stored only in your own browser.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23050807'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%2339ff8e' font-family='monospace'%3EC%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/pages.css">
</head>

<body>

    <canvas id="matrixCanvas"></canvas>

    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                <h1>Create Account</h1>
                <p class="auth-subtitle">Join CyberVerse to start learning cybersecurity</p>

                <p class="demo-notice" role="note">
                    Educational demo project: accounts are saved only in this browser, not on a server. Please do not use a real password.
                </p>

                <form id="registerForm">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="John Doe" autocomplete="name" required>

                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="student@cyberverse.io" autocomplete="email" required>

                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" autocomplete="new-password" minlength="8" required>

                    <!-- New Confirm Password Field -->
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="••••••••" autocomplete="new-password" minlength="8" required>

                    <div id="formError" class="form-error"></div>

                    <button type="submit" class="btn btn-primary auth-button">Create Account</button>
                </form>

                <p class="auth-bottom">
                    Already have an account? <a href="login.html">Log In</a>
                </p>
                <a href="index.html" class="back-home">&larr; Back to Home</a>

                <p class="auth-legal">
                    <a href="about.html">About</a> &middot; <a href="privacy.html">Privacy</a>
                </p>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
